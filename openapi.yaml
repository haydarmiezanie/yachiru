openapi: 3.1.0
info:
  title: "Yachiru: ClickHouse Optimization & Health Advisor API"
  version: 1.0.0
  description: Formal OpenAPI 3.1 specification for Yachiru. Provides programmatic
    endpoints to audit ClickHouse clusters across 9 critical performance
    dimensions, inspect system query telemetry, test cluster connectivity, and
    retrieve historical audit scorecards.
  contact:
    name: Yachiru Engineering Team
  license:
    name: MIT
servers:
  - url: /
    description: Current Environment / Local Server
tags:
  - name: System
    description: Service health, metadata, and available demo datasets
  - name: Auth
    description: Authentication context and current user profile
  - name: Scanner
    description: Connection testing and 9-dimension health audits
  - name: History
    description: Audit report persistence and historical scorecard retrieval
paths:
  /api/health:
    get:
      tags:
        - System
      summary: Service Health & Configuration Status
      description: Returns operational health status, service version, and AI provider
        availability.
      operationId: getHealth
      responses:
        "200":
          description: Service operational status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: Yachiru ClickHouse Optimization Scanner
                  version:
                    type: string
                    example: 1.0.0
                  aiConfigured:
                    type: boolean
                    example: true
                required:
                  - status
                  - service
                  - version
                  - aiConfigured
  /api/demo-clusters:
    get:
      tags:
        - System
      summary: List Available Pre-Packaged Demo Datasets
      description: Returns metadata for built-in benchmark clusters (Apex E-Commerce,
        Nexus IoT, FinPulse Ledger, CloudTrace Logs) for testing without
        external ClickHouse credentials.
      operationId: getDemoClusters
      responses:
        "200":
          description: List of demo cluster profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoCluster"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get Current Authenticated User Profile
      description: Returns profile, approval state, and role rank for the calling
        identity (Firebase token or API Key). In local dev mode without keys,
        returns a local viewer profile.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Current user profile and role
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserAuthProfile"
                required:
                  - user
        "401":
          description: Unauthorized - Invalid or missing token/API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - User account is pending administrator approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/clickhouse/test-connection:
    post:
      tags:
        - Scanner
      summary: Probe ClickHouse Connectivity & Permissions
      description: Validates host reachability, verifies user credentials, checks read
        permissions on system.* tables, and returns detected server version and
        latency. Requires `auditor` role or API Key.
      operationId: testClickHouseConnection
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestConnectionInput"
      responses:
        "200":
          description: Probe results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"
        "400":
          description: Invalid connection parameters or blocked SSRF host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Insufficient role (Auditor required)
        "500":
          description: Connection failure or network error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"
  /api/clickhouse/scan:
    post:
      tags:
        - Scanner
      summary: Execute 9-Dimension Health Scan & AI Synthesis
      description: Runs an in-depth, zero-mutation diagnostic scan against the target
        ClickHouse database. Correlates table schemas with system.query_log
        telemetry, executes 9 deterministic analyzers, applies
        heuristic/zero-raw PII masking, generates remediation DDL, and
        synthesizes executive insights. Requires `auditor` role or API Key.
      operationId: executeScan
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequestInput"
      responses:
        "200":
          description: Complete audit scorecard and remediation recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "400":
          description: Invalid scan configuration, invalid database name, or query timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Insufficient role (Auditor required)
        "429":
          description: Rate limit exceeded (too many concurrent scan requests)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/history:
    get:
      tags:
        - History
      summary: List Historical Scan Summaries
      description: Returns compact metadata summaries of previous audit runs sorted
        newest first. Requires `viewer` role or API Key.
      operationId: getHistorySummaries
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: List of historical audit runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanReportSummary"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Insufficient role
    delete:
      tags:
        - History
      summary: Clear Historical Scan Reports
      description: Permanently removes all saved audit history reports. Destructive
        operation requiring `admin` role or API Key.
      operationId: clearHistory
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: History cleared confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Scan history cleared
                required:
                  - success
                  - message
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Insufficient role (Admin required)
  /api/history/{id}:
    get:
      tags:
        - History
      summary: Retrieve Full Scan Report by ID
      description: Fetches the complete audit report including all 9 dimension scores,
        full findings, raw telemetry stats, and generated DDL migration scripts.
        Requires `viewer` role or API Key.
      operationId: getScanReportById
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique scan report identifier (e.g. scan-1741249000-abcde)
          schema:
            type: string
      responses:
        "200":
          description: Complete audit report document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Insufficient role
        "404":
          description: Scan report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/openapi.json:
    get:
      tags:
        - System
      summary: Download OpenAPI 3.1 Specification (JSON)
      description: Returns the machine-readable OpenAPI 3.1 JSON document for
        third-party tooling, SDK generation, or API gateways.
      operationId: getOpenApiJson
      responses:
        "200":
          description: OpenAPI 3.1 JSON Document
          content:
            application/json:
              schema:
                type: object
  /api/openapi.yaml:
    get:
      tags:
        - System
      summary: Download OpenAPI 3.1 Specification (YAML)
      description: Returns the machine-readable OpenAPI 3.1 YAML document.
      operationId: getOpenApiYaml
      responses:
        "200":
          description: OpenAPI 3.1 YAML Document
          content:
            application/yaml:
              schema:
                type: string
  /api/docs:
    get:
      tags:
        - System
      summary: Interactive Swagger UI Documentation
      description: Serves interactive Swagger UI exploring all request/response models
        and test execution directly in browser.
      operationId: getSwaggerDocs
      responses:
        "200":
          description: HTML Swagger UI interface
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Firebase Auth ID Token. Pass as `Authorization: Bearer
        <ID_TOKEN>`. Enforces user approval and RBAC role rank."
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Secret machine API key for CI/CD runners and automated audits
        (`YACHIRU_API_KEY`). Grants full service privileges.
  schemas:
    ScanTargetInput:
      type: object
      properties:
        host:
          default: localhost
          description: Target ClickHouse server hostname or IP address (e.g.
            clickhouse.internal or 198.51.100.24)
          type: string
          maxLength: 255
        port:
          default: 8123
          description: "ClickHouse HTTP interface port (default: 8123)"
          anyOf:
            - type: integer
              minimum: 1
              maximum: 65535
            - type: string
        protocol:
          default: http
          description: Connection protocol (http or https)
          type: string
          enum:
            - http
            - https
        user:
          default: default
          description: ClickHouse user with read-only access to system.* tables
          type: string
          maxLength: 255
        password:
          default: ""
          description: ClickHouse user password
          type: string
          maxLength: 1000
        database:
          default: default
          description: Target database to inspect and correlate with queries
          type: string
          maxLength: 256
        isDemoCluster:
          default: false
          description: When true, uses simulated in-memory benchmark data and bypasses
            network requests
          type: boolean
        demoClusterId:
          description: Pre-packaged demo dataset identifier (e.g. apex_ecommerce,
            nexus_iot, finpulse_ledger, cloudtrace_logs)
          type: string
          maxLength: 100
        lookbackDays:
          default: 7
          description: Number of days of system.query_log history to inspect for query
            bottleneck correlation
          anyOf:
            - type: integer
              minimum: 1
              maximum: 365
            - type: string
      required:
        - host
        - port
        - protocol
        - user
        - password
        - database
        - isDemoCluster
        - lookbackDays
      additionalProperties: false
    ScanRequestInput:
      type: object
      properties:
        target:
          type: object
          properties:
            host:
              default: localhost
              description: Target ClickHouse server hostname or IP address (e.g.
                clickhouse.internal or 198.51.100.24)
              type: string
              maxLength: 255
            port:
              default: 8123
              description: "ClickHouse HTTP interface port (default: 8123)"
              anyOf:
                - type: integer
                  minimum: 1
                  maximum: 65535
                - type: string
            protocol:
              default: http
              description: Connection protocol (http or https)
              type: string
              enum:
                - http
                - https
            user:
              default: default
              description: ClickHouse user with read-only access to system.* tables
              type: string
              maxLength: 255
            password:
              default: ""
              description: ClickHouse user password
              type: string
              maxLength: 1000
            database:
              default: default
              description: Target database to inspect and correlate with queries
              type: string
              maxLength: 256
            isDemoCluster:
              default: false
              description: When true, uses simulated in-memory benchmark data and bypasses
                network requests
              type: boolean
            demoClusterId:
              description: Pre-packaged demo dataset identifier (e.g. apex_ecommerce,
                nexus_iot, finpulse_ledger, cloudtrace_logs)
              type: string
              maxLength: 100
            lookbackDays:
              default: 7
              description: Number of days of system.query_log history to inspect for query
                bottleneck correlation
              anyOf:
                - type: integer
                  minimum: 1
                  maximum: 365
                - type: string
          required:
            - host
            - port
            - protocol
            - user
            - password
            - database
            - isDemoCluster
            - lookbackDays
          additionalProperties: false
          description: ClickHouse cluster connection target specifications
        aiEnabled:
          default: true
          description: Enable AI diagnostic synthesis for root-cause narratives and
            priority guidance
          type: boolean
        aiProvider:
          default: gemini
          description: AI synthesis engine provider
          type: string
          enum:
            - gemini
            - openai
        aiModel:
          description: Specific model identifier (e.g. gemini-3.7-flash, gpt-4o,
            gpt-4o-mini)
          type: string
          maxLength: 100
        aiApiKey:
          description: Optional custom API key. If omitted, uses server environment variable
          type: string
          maxLength: 500
      required:
        - target
        - aiEnabled
        - aiProvider
      additionalProperties: false
    TestConnectionInput:
      anyOf:
        - type: object
          properties:
            target:
              type: object
              properties:
                host:
                  default: localhost
                  description: Target ClickHouse server hostname or IP address (e.g.
                    clickhouse.internal or 198.51.100.24)
                  type: string
                  maxLength: 255
                port:
                  default: 8123
                  description: "ClickHouse HTTP interface port (default: 8123)"
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 65535
                    - type: string
                protocol:
                  default: http
                  description: Connection protocol (http or https)
                  type: string
                  enum:
                    - http
                    - https
                user:
                  default: default
                  description: ClickHouse user with read-only access to system.* tables
                  type: string
                  maxLength: 255
                password:
                  default: ""
                  description: ClickHouse user password
                  type: string
                  maxLength: 1000
                database:
                  default: default
                  description: Target database to inspect and correlate with queries
                  type: string
                  maxLength: 256
                isDemoCluster:
                  default: false
                  description: When true, uses simulated in-memory benchmark data and bypasses
                    network requests
                  type: boolean
                demoClusterId:
                  description: Pre-packaged demo dataset identifier (e.g. apex_ecommerce,
                    nexus_iot, finpulse_ledger, cloudtrace_logs)
                  type: string
                  maxLength: 100
                lookbackDays:
                  default: 7
                  description: Number of days of system.query_log history to inspect for query
                    bottleneck correlation
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 365
                    - type: string
              required:
                - host
                - port
                - protocol
                - user
                - password
                - database
                - isDemoCluster
                - lookbackDays
              additionalProperties: false
          required:
            - target
          additionalProperties: false
        - type: object
          properties:
            host:
              default: localhost
              description: Target ClickHouse server hostname or IP address (e.g.
                clickhouse.internal or 198.51.100.24)
              type: string
              maxLength: 255
            port:
              default: 8123
              description: "ClickHouse HTTP interface port (default: 8123)"
              anyOf:
                - type: integer
                  minimum: 1
                  maximum: 65535
                - type: string
            protocol:
              default: http
              description: Connection protocol (http or https)
              type: string
              enum:
                - http
                - https
            user:
              default: default
              description: ClickHouse user with read-only access to system.* tables
              type: string
              maxLength: 255
            password:
              default: ""
              description: ClickHouse user password
              type: string
              maxLength: 1000
            database:
              default: default
              description: Target database to inspect and correlate with queries
              type: string
              maxLength: 256
            isDemoCluster:
              default: false
              description: When true, uses simulated in-memory benchmark data and bypasses
                network requests
              type: boolean
            demoClusterId:
              description: Pre-packaged demo dataset identifier (e.g. apex_ecommerce,
                nexus_iot, finpulse_ledger, cloudtrace_logs)
              type: string
              maxLength: 100
            lookbackDays:
              default: 7
              description: Number of days of system.query_log history to inspect for query
                bottleneck correlation
              anyOf:
                - type: integer
                  minimum: 1
                  maximum: 365
                - type: string
          required:
            - host
            - port
            - protocol
            - user
            - password
            - database
            - isDemoCluster
            - lookbackDays
          additionalProperties: false
    TestConnectionResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether probe and authentication succeeded
        version:
          description: ClickHouse server version string
          type: string
        uptime:
          description: ClickHouse server uptime in seconds
          type: number
        clusterName:
          description: Detected cluster or host name
          type: string
        accessibleDatabases:
          description: List of accessible databases
          type: array
          items:
            type: string
        latencyMs:
          description: Round-trip HTTP probe latency in milliseconds
          type: number
        message:
          description: Diagnostic or error message
          type: string
        error:
          description: Detailed error description if probe failed
          type: string
      required:
        - success
      additionalProperties: false
    DimensionId:
      type: string
      enum:
        - table_engines_partitioning
        - parts_and_merges
        - primary_key_and_query_patterns
        - skip_indexes
        - data_types_and_storage
        - ttl_and_tiering
        - materialized_views_redundant_compute
        - resource_and_config
        - general_query_performance
    FindingSeverity:
      type: string
      enum:
        - critical
        - warning
        - info
        - optimal
    Finding:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this diagnostic finding
        dimension:
          type: string
          enum:
            - table_engines_partitioning
            - parts_and_merges
            - primary_key_and_query_patterns
            - skip_indexes
            - data_types_and_storage
            - ttl_and_tiering
            - materialized_views_redundant_compute
            - resource_and_config
            - general_query_performance
          description: Audit dimension category
        dimensionName:
          type: string
          description: Human-readable dimension title
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
            - optimal
          description: Severity level determining scorecard weighting
        title:
          type: string
          description: Concise finding headline
        tableName:
          description: Associated ClickHouse table name if applicable
          type: string
        what:
          type: string
          description: Factual telemetry evidence collected from ClickHouse system.* tables
        whyTechnical:
          type: string
          description: Technical mechanics explaining the performance impact or bottleneck
        whyNarrative:
          description: AI or contextual narrative explaining operational impact
          type: string
        recommendationSql:
          description: Actionable SQL or DDL migration script for manual verification
          type: string
        recommendationSummary:
          type: string
          description: Short prescriptive summary of remediation steps
        estimatedImpact:
          type: object
          properties:
            metric:
              type: string
              description: Primary metric impacted (e.g. Memory, Disk I/O, Query Latency)
            magnitude:
              type: string
              description: Expected magnitude of improvement (e.g. 3x - 10x, 40% - 60%)
            description:
              type: string
              description: Contextual justification for the estimated impact
          required:
            - metric
            - magnitude
            - description
          additionalProperties: false
        metrics:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: Raw key-value telemetry metrics supporting this finding
        aiInsight:
          description: AI diagnostic commentary tailored to this finding
          type: string
        aiSqlFix:
          description: AI-refined custom remediation query or DDL
          type: string
        aiRiskLevel:
          description: Assessed execution risk level
          type: string
          enum:
            - Low
            - Medium
            - High
            - Critical
        relativePriority:
          type: object
          properties:
            rank:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
              description: Order of priority relative to other findings
            effort:
              type: string
              enum:
                - Low
                - Medium
                - High
              description: Estimated implementation effort
            impact:
              type: string
              enum:
                - Low
                - Medium
                - High
                - Critical
              description: Expected business/performance impact
            justification:
              type: string
              description: Rationale for assigned priority rank
          required:
            - rank
            - effort
            - impact
            - justification
          additionalProperties: false
      required:
        - id
        - dimension
        - dimensionName
        - severity
        - title
        - what
        - whyTechnical
        - recommendationSummary
        - estimatedImpact
        - metrics
      additionalProperties: false
    DimensionScore:
      type: object
      properties:
        dimension:
          type: string
          enum:
            - table_engines_partitioning
            - parts_and_merges
            - primary_key_and_query_patterns
            - skip_indexes
            - data_types_and_storage
            - ttl_and_tiering
            - materialized_views_redundant_compute
            - resource_and_config
            - general_query_performance
        name:
          type: string
          description: Display name of dimension
        description:
          type: string
          description: Scope and criteria evaluated in this dimension
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Health score between 0 (failing) and 100 (optimal)
        criticalCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Number of critical findings in this dimension
        warningCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Number of warning findings in this dimension
        infoCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Number of informational observations
        optimalCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Number of audited checks passing optimal standards
        summary:
          type: string
          description: Executive evaluation summary for this dimension
      required:
        - dimension
        - name
        - description
        - score
        - criticalCount
        - warningCount
        - infoCount
        - optimalCount
        - summary
      additionalProperties: false
    ExecutiveSummary:
      type: object
      properties:
        overview:
          type: string
          description: Holistic evaluation of cluster performance and stability
        overallHealthGrade:
          type: string
          enum:
            - A+
            - A
            - B
            - C
            - D
            - F
          description: Aggregate letter grade
        topRisk:
          type: string
          description: Single most urgent risk identified across all dimensions
        quickWins:
          type: array
          items:
            type: string
          description: High-impact, low-effort remediation actions
        strategicFixes:
          type: array
          items:
            type: string
          description: Long-term architectural improvements
        aiGenerated:
          type: boolean
          description: True if synthesized via LLM, false if generated deterministically
        modelUsed:
          description: LLM model identifier used for synthesis
          type: string
        provider:
          description: AI provider name
          type: string
          enum:
            - gemini
            - openai
        aiNote:
          description: Advisory notes or caveats regarding AI output
          type: string
      required:
        - overview
        - overallHealthGrade
        - topRisk
        - quickWins
        - strategicFixes
        - aiGenerated
      additionalProperties: false
    ClusterMetadata:
      type: object
      properties:
        version:
          type: string
          description: ClickHouse server version string
        clusterName:
          type: string
          description: Resolved cluster or host identifier
        totalDatabases:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Total accessible databases
        totalTables:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Total tables inspected
        totalParts:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Total data parts across target tables
        totalRows:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Total row count across target tables
        totalDiskSizeBytes:
          type: number
          description: Total compressed size in bytes on disk
        totalDiskSizeFormatted:
          type: string
          description: Human-formatted disk size (e.g. 42.5 GB)
        queriesAnalyzed:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Total queries evaluated from system.query_log
        timeWindow:
          type: string
          description: Lookback time window examined
        uptimeSeconds:
          type: number
          description: Uptime of the ClickHouse service in seconds
      required:
        - version
        - clusterName
        - totalDatabases
        - totalTables
        - totalParts
        - totalRows
        - totalDiskSizeBytes
        - totalDiskSizeFormatted
        - queriesAnalyzed
        - timeWindow
        - uptimeSeconds
      additionalProperties: false
    ScanReportSummary:
      type: object
      properties:
        id:
          type: string
          description: Unique scan report ID (scan-<timestamp>-<hash>)
        timestamp:
          type: string
          description: ISO 8601 timestamp when audit was completed
        target:
          type: object
          properties:
            host:
              type: string
            port:
              type: number
            database:
              type: string
            isDemoCluster:
              type: boolean
