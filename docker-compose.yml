services:
  # ============================================================
  # Yachiru ClickHouse Analyzer Web App & API
  # ============================================================
  yachiru-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yachiru-analyzer
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - YACHIRU_API_KEY=${YACHIRU_API_KEY:-}
      - YACHIRU_REQUIRE_API_KEY=${YACHIRU_REQUIRE_API_KEY:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - YACHIRU_DATA_DIR=/app/data
      - YACHIRU_NARRATE_RATE_LIMIT_PER_MINUTE=${YACHIRU_NARRATE_RATE_LIMIT_PER_MINUTE:-15}
    volumes:
      - ${YACHIRU_DATA_DIR:-./data}:/app/data
    extra_hosts:
      # Allows connecting to ClickHouse running directly on your host machine
      # by entering 'host.docker.internal' as the host in the web UI
      - "host.docker.internal:host-gateway"

