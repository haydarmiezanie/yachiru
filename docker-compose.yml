services:
  # ---------------------------------------------------
  # Yachiru ClickHouse Optimization & Health Advisor
  # ---------------------------------------------------
  yachiru:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yachiru-advisor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - YACHIRU_API_KEY=${YACHIRU_API_KEY:-}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - yachiru-data:/app/data

volumes:
  yachiru-data:
    driver: local
