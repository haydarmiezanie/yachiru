services:
  # ============================================================
  # Yachiru ClickHouse Analyzer Web App & API
  # ============================================================
  yachiru-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yachiru-analyzer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      # Allows connecting to ClickHouse running directly on your host machine
      # by entering 'host.docker.internal' as the host in the web UI
      - "host.docker.internal:host-gateway"

